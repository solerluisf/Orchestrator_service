[package]
name = "orchestrator-service"
version = "0.1.0"
edition = "2021"
authors = ["Trading Platform Team"]
description = "Orchestrator Service — Central nervous system of the event-driven trading platform"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket
tokio-tungstenite = "0.21"

# ZeroMQ
zmq = { version = "0.9", features = ["vendored"] }

# Metrics
prometheus = "0.13"

# Error handling
thiserror = "1"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Tracing / Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.24"
opentelemetry = "0.22"
opentelemetry-otlp = "0.15"

# Config
dotenvy = "0.15"

# Cryptographic signing for audit
hmac = "0.12"
sha2 = "0.10"

# Async traits
async-trait = "0.1"

# Dashmap for concurrent maps
dashmap = "5"

# Regex (for topic matching)
regex = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client for health checks
reqwest = { version = "0.11", features = ["json"] }

# Futures
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
